name: Watchdog

# codeql.yml's only schedule fires Monday 23:15 UTC - this runs the
# following day so that run has already landed, and after this repo's
# other Monday-morning schedules (health-report.yml, issue-export.yml,
# weekly-insights.yml) too. See tools/watchdog/check.js's header comment
# for the full rationale, including the incident this repo already had.
on:
  schedule:
    - cron: '0 6 * * 2'  # Weekly, Tuesday 06:00 UTC
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install actionlint
        run: bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Check every workflow file is valid and every scheduled workflow's last run succeeded
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH="$PWD:$PATH"
          node tools/watchdog/check.js
