name: Ping CTO Hub
# NOTE: The automatic schedule is disabled (see below). This workflow was firing
# every 10 minutes against https://ai-cto-hub.vercel.app/api/autonomous_agent,
# passing only {owner, repo, mode} with no actual code context (no diff, no file
# contents, no commit SHA). With nothing real to inspect, the hub's LLM
# hallucinated a plausible-looking "bug + patch" every run and filed it as a
# GitHub issue -- none of which referenced code that exists in this repo. Over
# ~4 months this produced ~1,974 issues, ~220 of which were the hub failing to
# even serialize its own fabricated response ("[object Object]" bodies).
#
# Before re-enabling on a schedule: the payload needs to carry real context
# (e.g. the diff of the latest commit, or specific file contents) so the hub
# has something genuine to analyze, and the interval should be far coarser
# than every 10 minutes. Until then, trigger manually via workflow_dispatch
# when you actually want a hub run.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode to send to the hub'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - hunt
          - refactor

jobs:
  call-central-brain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine Mode
        id: mode
        run: |
          echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
      - name: Send Payload to Hub
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          # Only needed if the hub's Vercel deployment has Deployment
          # Protection enabled - see README.md on the hub repo (Mothership).
          VERCEL_BYPASS_TOKEN: ${{ secrets.VERCEL_BYPASS_TOKEN }}
        run: |
          curl -X POST "${VERCEL_URL}/api/autonomous_agent" \
            -H "Content-Type: application/json" \
            -H "x-vercel-protection-bypass: ${VERCEL_BYPASS_TOKEN}" \
            -d '{
              "owner": "${{ github.repository_owner }}",
              "repo": "${{ github.event.repository.name }}",
              "mode": "${{ steps.mode.outputs.mode }}"
            }'
