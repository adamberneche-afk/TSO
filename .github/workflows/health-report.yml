name: Daily Health Report

on:
  schedule:
    - cron: '0 7 * * *'  # Runs daily at 7:00 AM UTC (adjust for your timezone)
  workflow_dispatch:  # Allows manual triggers

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      issues: read  # Only needs read access to issues
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install Dependencies
        run: npm ci
        # health-analyzer.js only calls the GitHub REST API via @octokit/rest -
        # it never touches Prisma, so there's no schema to generate here (and
        # none exists at repo root; the real schema lives under
        # packages/registry/prisma). A prior version of this step ran
        # `npx prisma generate` unconditionally, which failed every run.

      - name: Run Health Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Auto‑provided by GitHub
        run: |
          node scripts/health-analyzer.js > daily_issues_report.md

      - name: Save Report as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: daily-issues-report
          path: daily_issues_report.md
          retention-days: 30  # Keep reports for 30 days (adjust as needed)
