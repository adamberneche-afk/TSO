name: Test and Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # This workflow was disabled at the GitHub Actions level for an
  # extended period (see HANDOFF.md) with no push/PR-based way to
  # verify a fix to it without waiting for the next real push. Adding
  # workflow_dispatch gives it a manual "Run workflow" button for
  # exactly that case going forward.
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tais_registry_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Install dependencies
      run: |
        cd packages/registry
        npm ci

    # @think/types is a `file:../types` dependency of packages/registry
    # (routes/audits.ts imports AuditReportSchema from it) -- npm ci
    # above resolves the symlink but never compiles it, so without this
    # step `tsc`/ts-jest fail with "Cannot find module '@think/types' or
    # its corresponding type declarations" (dist/index.d.ts doesn't
    # exist yet). build-all-packages.yml already builds packages/types
    # before packages/registry; this job just never got the same fix
    # because it was disabled the whole time that dependency was added.
    - name: Build packages/types (registry's @think/types dependency)
      run: |
        cd packages/types
        npm ci
        npm run build

    - name: Generate Prisma Client
      run: |
        cd packages/registry
        npx prisma generate

    - name: Run database migrations
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tais_registry_test
      run: |
        cd packages/registry
        npx prisma migrate deploy

    - name: Run tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tais_registry_test
        TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tais_registry_test
        # AuthService (src/services/auth.ts) rejects any JWT_SECRET under
        # 32 characters -- this one was 15, so `npm test` here never got
        # past `import app from '../../index'` and every e2e suite failed
        # before running a single test. The "build" job below already
        # used a 32+ char value; this job just never got the same fix.
        JWT_SECRET: test-secret-key-that-is-at-least-32-characters-long
        NODE_ENV: test
        # analytics.e2e.test.ts, admin-migration-auth.e2e.test.ts, and
        # monitoring-security.e2e.test.ts each read
        # process.env.ADMIN_WALLET_ADDRESSES! at module load time (no
        # fallback) to build their own test wallet -- unset, all three
        # suites failed to even load, before running a single test.
        ADMIN_WALLET_ADDRESSES: '0x1111111111111111111111111111111111111111'
      run: |
        cd packages/registry
        npm test -- --coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        file: ./packages/registry/coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true

  build:
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tais_registry_build
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Install dependencies
      run: |
        cd packages/registry
        npm ci

    # See the same step in the `test` job above: @think/types must be
    # compiled before packages/registry's own `tsc` build can resolve it.
    - name: Build packages/types (registry's @think/types dependency)
      run: |
        cd packages/types
        npm ci
        npm run build

    - name: Generate Prisma Client
      run: |
        cd packages/registry
        npx prisma generate

    - name: Build application
      run: |
        cd packages/registry
        npm run build

    - name: Verify build artifacts
      run: |
        cd packages/registry
        test -f dist/index.js
        test -d dist/routes
        test -d dist/services

    # A build that emits JS without a compiler error isn't the same as JS
    # that runs -- this is exactly the class of bug (ESM/CJS packaging
    # mismatches, a corrupted import, a route registered with invalid
    # syntax) that "does dist/ exist" cannot catch. Actually boot the
    # compiled server against a real database and hit a real endpoint.
    - name: Run database migrations
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tais_registry_build
      run: |
        cd packages/registry
        npx prisma migrate deploy

    - name: Smoke test the compiled server actually starts and serves requests
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tais_registry_build
        JWT_SECRET: build-smoke-test-secret-32-characters-min
        PORT: 3099
      run: |
        cd packages/registry
        node dist/index.js &
        SERVER_PID=$!
        for i in $(seq 1 20); do
          if curl -sf http://localhost:3099/health > /dev/null; then
            echo "Server is up"
            break
          fi
          if [ "$i" -eq 20 ]; then
            echo "Server never became healthy"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          sleep 0.5
        done
        response=$(curl -sf http://localhost:3099/health)
        echo "$response"
        echo "$response" | grep -q '"database":"connected"' || (echo "Database not reported as connected" && exit 1)
        kill $SERVER_PID

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Install dependencies
      run: |
        cd packages/registry
        npm ci

    - name: Run linter
      run: |
        cd packages/registry
        npm run lint

  root-tests:
    # The root-level tests/ suite (currently tests/watchdog.test.js,
    # exercised via the root package.json's own `npm test`) had no CI job
    # running it at all before this one - it could pass or fail locally and
    # neither push nor PR would ever notice.
    #
    # `npm test` also runs tests/e2e-hybrid-config.ts via tsx (P1.6 fix:
    # this real, 30+-assertion suite existed but was never run anywhere --
    # wrong extension for the old `tests/*.test.js` node:test glob). It
    # imports directly from tais_frontend/src, which is a separate project
    # with its own package.json/node_modules (not an npm workspace member),
    # so its dependencies need their own install step here.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install tais_frontend dependencies
      # tests/e2e-hybrid-config.ts imports from tais_frontend/src, which
      # resolves its own npm packages (marked, isomorphic-dompurify) from
      # tais_frontend/node_modules -- root `npm ci` above never touches it.
      working-directory: tais_frontend
      run: npm ci

    - name: Run root-level tests
      run: npm test
